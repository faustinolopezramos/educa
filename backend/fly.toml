app = "educa-backend"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

# Las migraciones corren una sola vez por despliegue, antes de que entre tráfico
# a la versión nueva. Si fallan, el despliegue se detiene y la versión anterior
# sigue sirviendo.
[deploy]
  release_command = "alembic upgrade head"

[env]
  PORT = "8080"
  PYTHONUNBUFFERED = "1"
  # Detrás del proxy de Fly la IP real viene en `Fly-Client-IP`, que pone la
  # plataforma. Con TRUST_PROXY_HEADERS=true (ver DEPLOYMENT.md) es de la que
  # se fían los límites de intentos; `X-Forwarded-For` lo puede escribir el cliente.
  CLIENT_IP_HEADER = "fly-client-ip"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "30s"
  method = "GET"
  path = "/health"