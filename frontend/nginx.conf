server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (ver nginx-security-headers.conf)
    include /etc/nginx/snippets/security-headers.conf;

    # SPA routing - redirect all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker y el manifest no pueden quedar en caché: un despliegue
    # tiene que llegar a ellos en la siguiente visita.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Sólo /assets/ es inmutable: Vite pone un hash en cada nombre, así que un
    # despliegue nuevo trae nombres nuevos. Lo que está en public/ (iconos) no
    # cambia de nombre, y marcarlo "immutable" un año impedía actualizarlo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/json;
}