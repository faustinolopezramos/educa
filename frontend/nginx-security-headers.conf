# Cabeceras de seguridad. Van en un archivo aparte porque nginx descarta los
# `add_header` del server en cualquier `location` que declare los suyos: sin
# incluirlo también ahí, sw.js (cuya CSP es la de su propia respuesta) y los
# assets salían sin ellas.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
# Los tokens de sesión viven en localStorage, legible por cualquier script de
# la página: la CSP (sólo scripts propios, sin inline) es lo que impide que un
# XSS los lea. `connect-src https: wss:` deja hablar con la API y Supabase
# sin fijar su dominio, que cambia por despliegue. Aquí también `http:`/`ws:`,
# porque este contenedor se usa con una API en HTTP (docker-compose); la
# protección que importa, `script-src 'self'`, no cambia.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
